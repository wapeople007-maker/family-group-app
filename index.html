<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리만의 가족·모임</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 로그인 / 회원가입 -->
  <section id="auth-screen" class="container">
    <div class="hero">
      <h1>우리만의 가족·모임</h1>
      <p>일정, 추억, 회비를 한곳에서 — 아이디만으로 간편하게 시작하세요</p>
    </div>
    <div class="grid-2">
      <form id="login-form" class="card stack">
        <h2>로그인</h2>
        <div>
          <label for="login-username">아이디</label>
          <input id="login-username" type="text" required placeholder="myid" autocomplete="username" />
        </div>
        <div>
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" required minlength="4" autocomplete="current-password" />
        </div>
        <button id="login-submit" class="btn-primary" type="submit">로그인</button>
      </form>

      <form id="signup-form" class="card stack">
        <h2>회원가입</h2>
        <div>
          <label for="signup-name">이름</label>
          <input id="signup-name" type="text" required placeholder="홍길동" />
        </div>
        <div>
          <label for="signup-username">아이디</label>
          <input id="signup-username" type="text" required placeholder="myid" autocomplete="username" />
        </div>
        <div>
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" type="password" required minlength="4" autocomplete="new-password" />
        </div>
        <button id="signup-submit" class="btn-secondary" type="submit">가입하기</button>
      </form>
    </div>
  </section>

  <!-- 모임 생성 / 참여 -->
  <section id="group-screen" class="container hidden">
    <div class="hero">
      <h1>모임에 참여하세요</h1>
      <p>새 모임을 만들거나, 초대 코드로 기존 모임에 들어갈 수 있어요.</p>
    </div>
    <div class="grid-2">
      <form id="create-group-form" class="card stack">
        <h2>모임 만들기</h2>
        <div>
          <label for="create-group-name">모임 이름</label>
          <input id="create-group-name" type="text" required placeholder="우리 가족, 동창회 12기..." />
        </div>
        <button id="create-group-submit" class="btn-primary" type="submit">모임 생성</button>
      </form>

      <form id="join-group-form" class="card stack">
        <h2>초대 코드로 참여</h2>
        <div>
          <label for="join-group-code">초대 코드 (6자리)</label>
          <input id="join-group-code" type="text" required maxlength="6" placeholder="ABC123" />
        </div>
        <button id="join-group-submit" class="btn-secondary" type="submit">참여하기</button>
      </form>
    </div>
  </section>

  <!-- 메인 앱 -->
  <section id="app-screen" class="container hidden">
    <div class="topbar">
      <div>
        <h1 id="group-name">모임</h1>
        <span class="badge">초대 코드: <strong id="invite-code">------</strong></span>
      </div>
      <button id="logout-btn" class="btn-secondary" type="button">로그아웃</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="home" type="button">홈</button>
      <button class="tab" data-tab="schedules" type="button">일정</button>
      <button class="tab" data-tab="todos" type="button">할 일</button>
      <button class="tab" data-tab="album" type="button">추억 앨범</button>
      <button class="tab" data-tab="expenses" type="button">회비 정산</button>
    </nav>

    <!-- 홈 -->
    <div id="panel-home">
      <div id="home-stats" class="summary-box"></div>
      <div class="card">
        <h2>다가오는 일정</h2>
        <div id="home-upcoming" class="list"></div>
      </div>
    </div>

    <!-- 일정 -->
    <div id="panel-schedules" class="hidden">
      <form id="schedule-form" class="card stack">
        <h2>일정 추가</h2>
        <input id="schedule-title" type="text" required placeholder="제목" />
        <input id="schedule-start" type="datetime-local" required />
        <div>
          <label for="schedule-location">장소</label>
          <div class="row map-search-row">
            <input id="schedule-location" type="text" placeholder="장소명 검색 또는 지도에서 클릭" />
            <button id="schedule-search-btn" class="btn-secondary" type="button">검색</button>
          </div>
          <ul id="schedule-search-results" class="search-results hidden"></ul>
        </div>
        <div id="schedule-map-picker" class="map-container hidden" aria-label="장소 선택 지도"></div>
        <p id="schedule-map-hint" class="map-hint hidden">검색 결과를 선택하거나, 지도를 클릭해 장소를 지정하세요.</p>
        <input id="schedule-lat" type="hidden" />
        <input id="schedule-lng" type="hidden" />
        <button class="btn-primary" type="submit">추가</button>
      </form>
      <div id="schedule-list" class="list" style="margin-top:16px"></div>
    </div>

    <!-- 할 일 -->
    <div id="panel-todos" class="hidden">
      <form id="todo-form" class="card stack">
        <h2>할 일 추가</h2>
        <input id="todo-title" type="text" required placeholder="할 일을 입력하세요" />
        <button class="btn-primary" type="submit">추가</button>
      </form>
      <div id="todo-list" class="list" style="margin-top:16px"></div>
    </div>

    <!-- 앨범 -->
    <div id="panel-album" class="hidden">
      <form id="photo-form" class="card stack">
        <h2>사진 업로드</h2>
        <input id="photo-file" type="file" accept="image/*" required />
        <input id="photo-caption" type="text" placeholder="설명 (선택)" />
        <button class="btn-primary" type="submit">업로드</button>
      </form>
      <div id="photo-grid" class="photo-grid" style="margin-top:16px"></div>
    </div>

    <!-- 회비 -->
    <div id="panel-expenses" class="hidden">
      <div id="expense-summary" class="summary-box"></div>
      <form id="expense-form" class="card stack">
        <h2>회비 내역 추가</h2>
        <input id="expense-title" type="text" required placeholder="항목 (예: 회식비)" />
        <input id="expense-amount" type="number" required min="0" step="100" placeholder="금액" />
        <textarea id="expense-note" placeholder="메모 (선택)"></textarea>
        <button class="btn-primary" type="submit">추가</button>
      </form>
      <div id="expense-list" class="list" style="margin-top:16px"></div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
